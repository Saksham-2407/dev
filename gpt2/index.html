<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI | Saksham</title>
    
    <!-- Google Fonts (Material Symbols & Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="title">Hey!!</h1>
        <p class="subtitle">How can I help?</p>
    </header>

    <div class="chat-list"></div>

    <div class="typing-area">
        <form action="#" class="typing-form">
            <div class="input-wrapper">
                <input type="text" class="typing-input" placeholder="Enter your problem">
                <button id="send-message-button" class="icon">
                    <span class="material-symbols-rounded">send</span>
                </button>
            </div>
            <div class="action-button">
                <span id="theme-toggle-button" class="icon">
                    <span class="material-symbols-rounded">light_mode</span>
                </span>
                <span id="delete-chat-button" class="icon">
                    <span class="material-symbols-rounded">delete_forever</span>
                </span>
            </div>
        </form>
    </div>

    <div class="credits">
        <p>Developed by - Saksham Malhotra</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
